name: CEL manylinux2014 wheels

# The pinned upstream tag contains Bazel-based C++ extensions. This workflow
# builds artifacts on native runners; publishing is a separate explicit step.
on:
  push:
    branches: [feat/prejudge-structured-pr1] # Temporary branch validation; remove before merge
  workflow_dispatch:
    inputs:
      build:
        description: Immutable rebuild number for optional release
        required: true
        default: "1"
      publish:
        description: Publish verified artifacts (fork default branch only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cel-manylinux2014-${{ inputs.build }}
  cancel-in-progress: false

env:
  CEL_VERSION: "0.1.3"
  CEL_COMMIT: 3e369fe3dfd29ef2fcb3d8a63997e58f50e592ae
  BAZEL_VERSION: "8.5.1"
  PYTHON_TAG: cp314

jobs:
  build:
    name: CEL cp314 on ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux2014_x86_64@sha256:692d8cc20cda555d8d8f3cd45dfa5bd499c543407425228c2edb54266715a1de
            bazel: https://github.com/bazelbuild/bazel/releases/download/8.5.1/bazel-8.5.1-linux-x86_64
            bazel_sha256: 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64@sha256:91bd6b14c15fe85c75118bc69dcbc7cb885abdb2436b5323c1ac29fcb1a81623
            bazel: https://github.com/bazelbuild/bazel/releases/download/8.5.1/bazel-8.5.1-linux-arm64
            bazel_sha256: b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout iCode scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout pinned CEL source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cel-expr/cel-python
          ref: ${{ env.CEL_COMMIT }}
          path: cel-source
          persist-credentials: false
      - name: Setup pinned project Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - name: Download and authenticate Bazel binary
        env:
          BAZEL_URL: ${{ matrix.bazel }}
          BAZEL_SHA256: ${{ matrix.bazel_sha256 }}
        run: |
          set -euo pipefail
          test "$(git -C cel-source rev-parse HEAD)" = "$CEL_COMMIT"
          test "$(cat cel-source/.bazelversion)" = "$BAZEL_VERSION"
          curl -fL --retry 3 --proto '=https' --tlsv1.2 "$BAZEL_URL" -o bazel-pinned
          echo "$BAZEL_SHA256  bazel-pinned" | sha256sum -c --strict -
          chmod +x bazel-pinned
      - name: Stage noninteractive upstream wheel recipe
        run: |
          python scripts/stage_cel_wheel.py \
            --source cel-source --output cel-stage \
            --bazel bazel-pinned --smoke scripts/cel_native_smoke.py \
            --prejudge src/chrys/service/approval/prejudge_v2/__init__.py \
            --integration-smoke scripts/cel_prejudge_smoke.py
          ! grep -F 'http.sslVerify false' cel-stage/pyproject.toml
          grep -F 'version = "0.1.3"' cel-stage/pyproject.toml
      - name: Build and smoke-test native wheel inside manylinux2014
        uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        env:
          CIBW_PLATFORM: linux
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: cp314-manylinux_${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.image }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.image }}
        with:
          package-dir: cel-stage
          output-dir: wheelhouse
      - name: Audit final wheel and native symbols
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(wheelhouse/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install auditwheel==6.8.2
          auditwheel show "${wheels[0]}" | tee wheel-auditwheel.txt
          python scripts/verify_cel_wheel.py "${wheels[0]}" --arch "$TARGET_ARCH" | tee wheel-elf.json
          (cd wheelhouse && sha256sum -- *.whl > "SHA256SUMS-$TARGET_ARCH")
      - name: Upload wheel and evidence (not a published release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cel-0.1.3-cp314-${{ matrix.arch }}
          path: |
            wheelhouse/*
            wheel-auditwheel.txt
            wheel-elf.json
          if-no-files-found: error

  publish:
    name: Explicit fork pre-release
    needs: build
    if: inputs.publish && github.repository == 'zshufan/iCode' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cel-0.1.3-cp314-*
          merge-multiple: true
          path: wheelhouse
      - name: Verify checksums and publish an unused rebuild number
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ inputs.build }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          tag="cel-expr-python-$CEL_VERSION-manylinux2014.$BUILD_NUMBER"
          for arch in x86_64 aarch64; do
            test -f "wheelhouse/SHA256SUMS-$arch"
            (cd wheelhouse && sha256sum --strict -c "SHA256SUMS-$arch")
          done
          if gh release view "$tag" >/dev/null 2>&1 || \
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag/release already exists: $tag" >&2
            exit 1
          fi
          cat wheelhouse/SHA256SUMS-{x86_64,aarch64} > wheelhouse/SHA256SUMS
          gh release create "$tag" wheelhouse/*.whl wheelhouse/SHA256SUMS \
            --title "$tag" --prerelease --latest=false \
            --notes "cp314 manylinux2014 CEL rebuild. See workflow build logs for native runtime smoke and ELF audits."
